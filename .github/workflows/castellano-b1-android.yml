name: Castellano B1 Android

on:
  push:
    branches:
      - build/castellano-b1-v0.1.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p castellano-b1 assembleDebug --stacktrace
      - name: Prepare artifact
        run: cp castellano-b1/app/build/outputs/apk/debug/app-debug.apk Castellano-B1-v0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Castellano-B1-v0.1.0
          path: Castellano-B1-v0.1.0.apk
          if-no-files-found: error
