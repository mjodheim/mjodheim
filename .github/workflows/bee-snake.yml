name: 🐝 Bee Snake

on:
  schedule:
    # Toutes les 12 h (UTC). Régénère la traînée de miel avec tes contributions.
    - cron: "0 */12 * * *"
  workflow_dispatch: # bouton "Run workflow" pour tester à la demande
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bee-snake
  cancel-in-progress: true

jobs:
  bee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Génère le snake.svg aux couleurs miel/ambre
      - name: Generate snake (honey palette)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%23FFC300&color_dots=%231b1300,%235c4400,%23a37b00,%23e0a800,%23ffd34d

      # 2) Remplace la tête par une abeille
      - name: Beeify 🐝
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/beeify.mjs dist/snake.svg assets/bee.svg

      # 3) Publie le résultat sur la branche "output"
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
