<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- wings -->
  <g opacity="0.85">
    <ellipse cx="24" cy="42" rx="18" ry="11" fill="#dff3ff" stroke="#a9d6ef" stroke-width="2"
             transform="rotate(-25 24 42)"/>
    <ellipse cx="76" cy="42" rx="18" ry="11" fill="#dff3ff" stroke="#a9d6ef" stroke-width="2"
             transform="rotate(25 76 42)"/>
  </g>

  <!-- body (honey gold) -->
  <ellipse cx="50" cy="58" rx="20" ry="30" fill="#ffc107" stroke="#3a2e00" stroke-width="3"/>

  <!-- black stripes -->
  <g fill="#3a2e00">
    <rect x="31" y="46" width="38" height="7"  rx="3"/>
    <rect x="30" y="60" width="40" height="7"  rx="3"/>
    <rect x="33" y="74" width="34" height="7"  rx="3"/>
  </g>

  <!-- stinger -->
  <path d="M50 90 l-4 -8 h8 z" fill="#3a2e00"/>

  <!-- head -->
  <circle cx="50" cy="22" r="13" fill="#3a2e00"/>
  <!-- eyes -->
  <circle cx="45" cy="20" r="2.6" fill="#fff"/>
  <circle cx="55" cy="20" r="2.6" fill="#fff"/>

  <!-- antennae -->
  <g stroke="#3a2e00" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M44 12 q-5 -7 -10 -8"/>
    <path d="M56 12 q5 -7 10 -8"/>
  </g>
  <circle cx="33" cy="4" r="3" fill="#3a2e00"/>
  <circle cx="67" cy="4" r="3" fill="#3a2e00"/>
</svg>
